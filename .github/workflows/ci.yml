# Every push and pull request: the tests, the replay regression, the
# paper twin gate (ADR 0009, step 0) and the board's aarch64 build; a v* tag
# also publishes that build on the release. Release builds throughout: the replay
# and the twin are numeric and run ten times faster optimized, and a release
# build is what the duck runs.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Unit tests, the golden routes, the property tests on the planner's
      # rules, and the replay of house2's recorded walk (maploc's
      # `kinematics` feature is what reprojects its depth frames).
      - name: Tests
        run: cargo test --workspace --release --features maploc/kinematics

      # docs/knobs.md is generated from the code: a knob added, renamed or
      # dropped without regenerating it fails here.
      - name: Knobs list current
        run: python3 scripts/knobs.py --check

      # The explorer and the journey against the kinematic duck, fixed seeds.
      - name: Paper twin gate
        run: |
          cargo build --release -p quack-nav --example paper_twin
          mkdir -p "$RUNNER_TEMP/paper-twin"
          python3 scripts/ci/paper_twin_gate.py target/release/examples/paper_twin \
            quack-nav/examples/apartment.world.json "$RUNNER_TEMP/paper-twin"

  # quack-navd for the duck's board (Radxa Zero 3, RK3566, aarch64 Linux),
  # built the way scripts/cross-build.sh builds it: cargo-zigbuild, glibc
  # floor 2.31. Every push leaves it as an artifact; a v* tag also attaches
  # it to the GitHub release (the `release` job below).
  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross-build
        run: scripts/cross-build.sh

      # An ARM aarch64 ELF, and no glibc symbol newer than the floor.
      - name: Check the binary
        run: |
          bin=target/aarch64-unknown-linux-gnu/release/quack-navd
          file "$bin" | tee /dev/stderr | grep -q 'ARM aarch64'
          newest=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.31\n' "$newest" | sort -V | tail -1)" = GLIBC_2.31 ]
          mkdir -p dist
          cp "$bin" dist/quack-navd-aarch64-linux
          (cd dist && sha256sum quack-navd-aarch64-linux > quack-navd-aarch64-linux.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: quack-navd-aarch64-linux
          path: dist/

  # A v* tag: the board's binary and its checksum on the GitHub release,
  # once the tests and the build have passed. A tag with -rc in it is a
  # prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quack-navd-aarch64-linux
          path: dist

      # The release's text is docs/release-notes-<tag>.md when there is one,
      # its relative links made absolute to the files at the tag.
      - name: Release notes
        run: |
          python3 scripts/ci/release_body.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes.md"
          echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ env.NOTES }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: false
