[package]
name = "quack-nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Navigation for the Microduck: the robot.map client, the cliff guard, a costmap planner, a places registry, an explorer and a homecoming — and a paper twin to measure them on"

# No dependency on quacksat-core: this crate is the navigation, and it
# left the satellite's workspace for a repo of its own (2026-09-22).
[[bin]]
name = "quack-navd"
path = "src/bin/quack-navd.rs"

[dependencies]
anyhow.workspace = true
duck-ipc-proto.workspace = true
kinematics.workspace = true
# The SLAM, hosted in quack-navd when `[maploc] enabled` (see src/mapd).
maploc = { workspace = true, features = ["kinematics"] }
quack-duck.workspace = true
serde.workspace = true
# quack-navd saves the mapping session on SIGTERM (src/bin/quack-navd.rs).
signal-hook = "0.3"
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
